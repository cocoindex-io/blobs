<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"
     aria-labelledby="main-title main-desc"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="main-title">app_main mounts one Processing Component per project</title>
  <desc id="main-desc">The CocoIndex App scans the Projects directory; for each project subdirectory (code_embedding, file_transform) it mounts a Processing Component that runs process project and writes a Markdown file to the Output Folder.</desc>

  <!--
    Drawn against the docs diagram palette
    (cocoindex/docs/src/components/diagrams/diagrams.css):
      cream         #FCF3D8   neutral fill
      cream-warm    #FAEAC0   app container
      maroon        #532638   stroke / labels
      coral         #BE5133   accent stroke / app outline
      palm          #27E62B   highlight ("the thing being discussed")
      maroon-ink    #2A121B   primary text
    Shape semantics (matches app.svg):
      sharp rectangle             → DATA  (State)
      round rectangle             → LOGIC (Source/Target System, Transform F(x))
      bullet (flat left, round right) → TARGET STATE
      peach round container       → CocoIndex App
      thick palm-green border     → highlight on whichever shape the prose discusses
  -->
  <defs>
    <style>
      .dg-source-target  { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-app            { fill: #FAEAC0; stroke: #BE5133; stroke-width: 1.6; }
      .dg-data           { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-data-highlight { fill: none;    stroke: #27E62B; stroke-width: 4; }
      .dg-component      { fill: #FCF3D8; stroke: #27E62B; stroke-width: 4; }
      .dg-logic          { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-target-state   { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-label          { fill: #2A121B; font-size: 14px; font-weight: 500;
                           text-anchor: middle; dominant-baseline: middle; }
      .dg-label--app     { fill: #BE5133; font-size: 14px; font-weight: 700;
                           text-anchor: middle; dominant-baseline: middle; }
      .dg-label--bold-l  { fill: #2A121B; font-size: 14px; font-weight: 700;
                           text-anchor: start;  dominant-baseline: middle; }
      .dg-label--small   { fill: #2A121B; font-size: 12px; font-weight: 500;
                           text-anchor: middle; dominant-baseline: middle; }
      .dg-arrow          { fill: none; stroke: #2A121B; stroke-width: 1.6; }
      .dg-arrow-head     { fill: #2A121B; }
      .dg-connector      { fill: none; stroke: rgba(42,18,27,0.45); stroke-width: 1.4;
                           stroke-dasharray: 5 5; }
      .ico               { fill: #FCF3D8; stroke: #532638; stroke-width: 1.2; }
    </style>

    <symbol id="ico-folder" viewBox="0 0 24 18">
      <path class="ico" d="M 1 4 L 8 4 L 11 1 L 23 1 L 23 17 L 1 17 Z"/>
    </symbol>
    <symbol id="ico-pyfile" viewBox="0 0 22 26">
      <path class="ico" d="M 1 1 L 16 1 L 21 6 L 21 25 L 1 25 Z"/>
      <path class="ico" d="M 16 1 L 21 6 L 16 6 Z"/>
      <text x="11" y="19" font-size="8" font-weight="700" text-anchor="middle"
            dominant-baseline="middle" fill="#2A121B">py</text>
    </symbol>
  </defs>

  <!-- ───── Projects (source system, round rectangle) ───── -->
  <g>
    <rect class="dg-source-target" x="20" y="180" width="110" height="120" rx="10"/>
    <text class="dg-label" x="75" y="240">Projects</text>
  </g>

  <!-- ───── CocoIndex App (peach container) ───── -->
  <g>
    <rect class="dg-app" x="160" y="20" width="900" height="440" rx="16"/>
    <text class="dg-label dg-label--app" x="610" y="42">CocoIndex App</text>

    <!-- ─── Row 1: code_embedding ─── -->
    <!-- data state (sharp rect) with palm-green highlight ring -->
    <g>
      <rect class="dg-data-highlight" x="194" y="70" width="232" height="128" rx="10"/>
      <rect class="dg-data"           x="200" y="76" width="220" height="116"/>
      <use href="#ico-folder" x="216" y="89" width="24" height="18"/>
      <text class="dg-label--bold-l" x="248" y="98">code_embedding</text>
      <use href="#ico-pyfile" x="216" y="138" width="22" height="26"/>
      <use href="#ico-pyfile" x="246" y="138" width="22" height="26"/>
      <use href="#ico-folder" x="282" y="142" width="24" height="18"/>
    </g>

    <!-- arrow: data state → Processing Component -->
    <path class="dg-arrow" d="M 426 134 L 454 134"/>
    <polygon class="dg-arrow-head" points="460,134 452,130 452,138"/>

    <!-- Processing Component container (palm-green stroke, round rect) -->
    <g>
      <rect class="dg-component" x="460" y="70" width="540" height="128" rx="14"/>
      <text class="dg-label--small" x="730" y="88">Processing Component</text>

      <!-- process project (logic, round rectangle) -->
      <rect class="dg-logic" x="484" y="116" width="180" height="56" rx="10"/>
      <text class="dg-label" x="574" y="146">process project</text>

      <!-- arrow: process project → bullet target state -->
      <path class="dg-arrow" d="M 664 144 L 700 144"/>
      <polygon class="dg-arrow-head" points="706,144 698,140 698,148"/>

      <!-- target-state bullet (flat left, rounded right) -->
      <path class="dg-target-state"
            d="M 706 116 L 880 116 A 28 28 0 0 1 880 172 L 706 172 Z"/>
      <text class="dg-label" x="800" y="146">code_embedding.md</text>
    </g>

    <!-- ─── Row 2: file_transform ─── -->
    <g>
      <rect class="dg-data-highlight" x="194" y="276" width="232" height="128" rx="10"/>
      <rect class="dg-data"           x="200" y="282" width="220" height="116"/>
      <use href="#ico-folder" x="216" y="295" width="24" height="18"/>
      <text class="dg-label--bold-l" x="248" y="304">file_transform</text>
      <use href="#ico-pyfile" x="216" y="344" width="22" height="26"/>
      <use href="#ico-pyfile" x="246" y="344" width="22" height="26"/>
      <use href="#ico-folder" x="282" y="348" width="24" height="18"/>
    </g>

    <path class="dg-arrow" d="M 426 340 L 454 340"/>
    <polygon class="dg-arrow-head" points="460,340 452,336 452,344"/>

    <g>
      <rect class="dg-component" x="460" y="276" width="540" height="128" rx="14"/>
      <text class="dg-label--small" x="730" y="294">Processing Component</text>

      <rect class="dg-logic" x="484" y="322" width="180" height="56" rx="10"/>
      <text class="dg-label" x="574" y="352">process project</text>

      <path class="dg-arrow" d="M 664 350 L 700 350"/>
      <polygon class="dg-arrow-head" points="706,350 698,346 698,354"/>

      <path class="dg-target-state"
            d="M 706 322 L 880 322 A 28 28 0 0 1 880 378 L 706 378 Z"/>
      <text class="dg-label" x="800" y="352">file_transform.md</text>
    </g>
  </g>

  <!-- Projects → per-project data card arrows (solid, with arrowhead;
       drawn after the App so they sit on top of the peach fill) -->
  <path class="dg-arrow" d="M 130 220 C 160 220, 160 134, 180 134"/>
  <polygon class="dg-arrow-head" points="186,134 178,130 178,138"/>
  <path class="dg-arrow" d="M 130 260 C 160 260, 160 340, 180 340"/>
  <polygon class="dg-arrow-head" points="186,340 178,336 178,344"/>

  <!-- App → Output Folder connectors (dashed, no arrowhead) -->
  <path class="dg-connector" d="M 908 144 C 1020 144, 1020 224, 1080 224"/>
  <path class="dg-connector" d="M 908 350 C 1020 350, 1020 256, 1080 256"/>

  <!-- ───── Output Folder (target system, round rectangle) ───── -->
  <g>
    <rect class="dg-source-target" x="1080" y="180" width="100" height="120" rx="10"/>
    <text class="dg-label" x="1130" y="232">Output</text>
    <text class="dg-label" x="1130" y="250">Folder</text>
  </g>
</svg>
