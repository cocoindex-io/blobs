<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" role="img"
     aria-labelledby="app-title app-desc"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="app-title">App definition</title>
  <desc id="app-desc">A CocoIndex App binds a source-state, a transform F(x), and a target-state into a single runnable unit. The App receives data from a source system on the left and writes results to a target system on the right.</desc>

  <!--
    Drawn against the docs diagram palette
    (cocoindex/docs/src/components/diagrams/diagrams.css):
      cream         #FCF3D8   neutral fill
      cream-warm    color-mix(peach 10%, cream)  → #FAEAC0   app container
      maroon        #532638   stroke / labels
      coral         #BE5133   accent stroke / app outline
      palm          #27E62B   highlight ("the thing being discussed")
      maroon-ink    #2A121B   primary text
    Shape semantics (single source of truth: docs/src/components/diagrams/README.md):
      sharp rectangle             → DATA  (State)
      round rectangle             → LOGIC (Source System, Target System, Transform F(x))
      bullet (flat left, round right) → TARGET STATE
      peach round container       → CocoIndex App
      thick palm-green border     → highlight on whichever shape the prose discusses
  -->
  <defs>
    <style>
      .dg-source-target { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-app           { fill: #FAEAC0; stroke: #BE5133; stroke-width: 1.6; }
      .dg-app-highlight { fill: none;    stroke: #27E62B; stroke-width: 4; }
      .dg-data          { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-logic         { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-target-state  { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-label         { fill: #2A121B; font-size: 14px; font-weight: 500;
                          text-anchor: middle; dominant-baseline: middle; }
      .dg-label--app    { fill: #BE5133; font-size: 14px; font-weight: 700; }
      .dg-arrow         { fill: none; stroke: #2A121B; stroke-width: 1.6; }
      .dg-arrow-head    { fill: #2A121B; }
      .dg-connector     { fill: none; stroke: rgba(42,18,27,0.45); stroke-width: 1.4;
                          stroke-dasharray: 5 5; }
    </style>
  </defs>

  <!-- ───── Source System (logic, round rectangle) ───── -->
  <g>
    <rect class="dg-source-target" x="20" y="60" width="100" height="100" rx="10"/>
    <text class="dg-label" x="70" y="103">Source</text>
    <text class="dg-label" x="70" y="121">System</text>
  </g>

  <!-- Source → App connector (dashed, no arrowhead per Connector convention) -->
  <path class="dg-connector" d="M 120 110 L 152 110"/>

  <!-- ───── CocoIndex App (peach container, palm-green highlight) ───── -->
  <g>
    <!-- highlight ring sits just outside the app container -->
    <rect class="dg-app-highlight" x="148" y="26" width="500" height="168" rx="18"/>
    <rect class="dg-app"           x="152" y="30" width="492" height="160" rx="16"/>
    <text class="dg-label dg-label--app" x="398" y="50">CocoIndex App</text>

    <!-- State (data, sharp rectangle) -->
    <g>
      <rect class="dg-data" x="180" y="80" width="96" height="80"/>
      <text class="dg-label" x="228" y="120">State</text>
    </g>

    <!-- arrow: State → Transform -->
    <path class="dg-arrow" d="M 276 120 L 314 120"/>
    <polygon class="dg-arrow-head" points="320,120 312,116 312,124"/>

    <!-- Transform F(x) (logic, round rectangle) -->
    <g>
      <rect class="dg-logic" x="320" y="80" width="120" height="80" rx="10"/>
      <text class="dg-label" x="380" y="113">Transform</text>
      <text class="dg-label" x="380" y="131">F(x)</text>
    </g>

    <!-- arrow: Transform → Target State -->
    <path class="dg-arrow" d="M 440 120 L 478 120"/>
    <polygon class="dg-arrow-head" points="484,120 476,116 476,124"/>

    <!-- Target State (target-state bullet: flat left, rounded right) -->
    <g>
      <path class="dg-target-state"
            d="M 484 80 L 580 80 A 40 40 0 0 1 580 160 L 484 160 Z"/>
      <text class="dg-label" x="528" y="113">Target</text>
      <text class="dg-label" x="528" y="131">State</text>
    </g>
  </g>

  <!-- App → Target connector (dashed) -->
  <path class="dg-connector" d="M 644 110 L 680 110"/>

  <!-- ───── Target System (logic, round rectangle) ───── -->
  <g>
    <rect class="dg-source-target" x="680" y="60" width="100" height="100" rx="10"/>
    <text class="dg-label" x="730" y="103">Target</text>
    <text class="dg-label" x="730" y="121">System</text>
  </g>
</svg>
