<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img"
     aria-labelledby="app-title app-desc"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="app-title">App definition: MultiCodebaseSummarization</title>
  <desc id="app-desc">A CocoIndex App ties the main function app_main together with its arguments root_dir = ./projects and output_dir = ./output, becoming the single runnable unit that sweeps the source folder and writes a wiki page per project to the target folder.</desc>

  <!--
    Drawn against the docs diagram palette
    (cocoindex/docs/src/components/diagrams/diagrams.css):
      cream         #FCF3D8   neutral fill
      cream-warm    color-mix(peach 10%, cream)  → #FAEAC0   app container
      maroon        #532638   stroke / labels
      coral         #BE5133   accent stroke / app outline
      maroon-ink    #2A121B   primary text
      muted ink     rgba(42,18,27,.58)            secondary labels
    Shape semantics (single source of truth: docs/src/components/diagrams/README.md):
      sharp rectangle  → DATA  (root_dir / output_dir args)
      round rectangle  → LOGIC (app_main, source / target system)
      peach round box  → CocoIndex App  (the highlighted container)
  -->
  <defs>
    <style>
      .dg-source-target { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-app           { fill: #FAEAC0; stroke: #BE5133; stroke-width: 1.6; }
      .dg-data          { fill: #FCF3D8; stroke: #532638; stroke-width: 1.4; }
      .dg-logic--main   { fill: #FCF3D8; stroke: #BE5133; stroke-width: 1.8; }
      .dg-label         { fill: #2A121B; font-size: 13px; font-weight: 500; text-anchor: middle; dominant-baseline: middle; }
      .dg-label--small  { font-size: 11px; }
      .dg-label--caps   { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
                          font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
                          fill: rgba(42,18,27,0.58); }
      .dg-label--mono   { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
                          font-size: 11px; }
      .dg-arrow         { fill: none; stroke: #2A121B; stroke-width: 1.6; }
      .dg-arrow-head    { fill: #2A121B; }
      .dg-connector     { fill: none; stroke: rgba(42,18,27,0.45); stroke-width: 1.4;
                          stroke-dasharray: 5 5; }
    </style>
  </defs>

  <!-- ───── Source system: ./projects/ ───── -->
  <g>
    <rect class="dg-source-target" x="20" y="74" width="140" height="92" rx="10"/>
    <text class="dg-label dg-label--caps" x="90" y="98">SOURCE</text>
    <text class="dg-label dg-label--mono" x="90" y="125">./projects/</text>
    <text class="dg-label dg-label--small" x="90" y="146" fill="rgba(42,18,27,0.58)">N project dirs</text>
  </g>

  <!-- ───── App container: MultiCodebaseSummarization ───── -->
  <g>
    <rect class="dg-app" x="180" y="30" width="440" height="180" rx="16"/>
    <text class="dg-label dg-label--caps" x="400" y="54" fill="#BE5133">CocoIndex App</text>
    <text class="dg-label" x="400" y="74" font-weight="600">MultiCodebaseSummarization</text>

    <!-- root_dir argument (data) -->
    <g>
      <rect class="dg-data" x="200" y="118" width="120" height="64"/>
      <text class="dg-label dg-label--caps" x="260" y="138">ARG</text>
      <text class="dg-label dg-label--mono" x="260" y="159">root_dir</text>
      <text class="dg-label dg-label--small" x="260" y="175" fill="rgba(42,18,27,0.58)">./projects</text>
    </g>

    <!-- app_main function (logic, highlighted as main) -->
    <g>
      <rect class="dg-logic--main" x="340" y="115" width="120" height="70" rx="10"/>
      <text class="dg-label dg-label--caps" x="400" y="135" fill="#BE5133">MAIN FN</text>
      <text class="dg-label dg-label--mono" x="400" y="156" font-weight="600">app_main()</text>
      <text class="dg-label dg-label--small" x="400" y="173" fill="rgba(42,18,27,0.58)">@coco.function</text>
    </g>

    <!-- output_dir argument (data) -->
    <g>
      <rect class="dg-data" x="480" y="118" width="120" height="64"/>
      <text class="dg-label dg-label--caps" x="540" y="138">ARG</text>
      <text class="dg-label dg-label--mono" x="540" y="159">output_dir</text>
      <text class="dg-label dg-label--small" x="540" y="175" fill="rgba(42,18,27,0.58)">./output</text>
    </g>

    <!-- bind arrows: root_dir → app_main → output_dir -->
    <g>
      <path class="dg-arrow" d="M 320 150 L 336 150"/>
      <polygon class="dg-arrow-head" points="340,150 333,146 333,154"/>
      <path class="dg-arrow" d="M 460 150 L 476 150"/>
      <polygon class="dg-arrow-head" points="480,150 473,146 473,154"/>
    </g>
  </g>

  <!-- ───── Target system: ./output/ ───── -->
  <g>
    <rect class="dg-source-target" x="640" y="74" width="140" height="92" rx="10"/>
    <text class="dg-label dg-label--caps" x="710" y="98">TARGET</text>
    <text class="dg-label dg-label--mono" x="710" y="125">./output/</text>
    <text class="dg-label dg-label--small" x="710" y="146" fill="rgba(42,18,27,0.58)">wiki page per project</text>
  </g>

  <!-- ───── External dashed connectors ───── -->
  <path class="dg-connector" d="M 160 120 L 200 120"/>
  <path class="dg-connector" d="M 600 120 L 640 120"/>
</svg>
