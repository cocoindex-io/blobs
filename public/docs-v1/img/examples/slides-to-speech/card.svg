<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Slides to narrated search — render slides, write speaker notes with a vision LLM, narrate with Piper TTS, embed into LanceDB.">
  <title>Slides to Narrated Search</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="131.2" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">SLIDES · NARRATE</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(22,106)"><rect x="0" y="0" width="120" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">SLIDES.PDF</text>
    <g transform="translate(20,28)"><rect width="80" height="50" rx="3" fill="none" stroke="#E59A63" stroke-width="1.5"/><path d="M34 18 l14 7 l-14 7 z" fill="#E59A63"/></g>
    <text x="60" y="106" text-anchor="middle" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="8.5" font-style="italic" fill="rgba(252,243,216,0.40)">render each slide</text></g><g transform="translate(150,118)"><text x="26" y="-4" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" font-weight="700" fill="#BE5133">VISION→TTS</text><path class="flow" d="M0 28 L50 28" stroke="#BE5133" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ahc)"/>
    <g transform="translate(8,44)"><rect class="rise" x="0" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0s"/><rect class="rise" x="6" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.1s"/><rect class="rise" x="12" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.2s"/><rect class="rise" x="18" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.30000000000000004s"/><rect class="rise" x="24" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.4s"/><rect class="rise" x="30" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.5s"/><rect class="rise" x="36" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.6000000000000001s"/><rect class="rise" x="42" y="-8" width="3" height="16" rx="1.5" fill="#F5D76E" style="animation-delay:0.7000000000000001s"/></g></g><g transform="translate(228,106)"><rect x="0" y="0" width="232" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#3DE05A">NOTES + AUDIO → LANCEDB</text>
    <rect x="14" y="34" width="200" height="6" rx="3" fill="#FCF3D8" fill-opacity="0.34"/><rect x="14" y="48" width="176" height="6" rx="3" fill="#FCF3D8" fill-opacity="0.29000000000000004"/><rect x="14" y="62" width="190" height="6" rx="3" fill="#FCF3D8" fill-opacity="0.24000000000000002"/>
    <text x="14" y="96" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" fill="#F5D76E">🔊 piper TTS narration</text>
    <text x="14" y="112" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8" fill="#3DE05A">embed → LanceDB</text></g>
</svg>