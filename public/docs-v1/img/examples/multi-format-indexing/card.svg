<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Multi-format visual search — index PDFs and images as page screenshots with ColPali, no OCR or chunking, into Qdrant.">
  <title>Multi-format Visual Search</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="137.9" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">PDF+IMG · COLPALI</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(20,106)"><rect x="0" y="0" width="116" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">PDF + IMG</text>
    <g transform="translate(22,26)"><rect width="72" height="30" rx="3" fill="none" stroke="#E59A63" stroke-width="1.4"/><text x="36" y="19" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9" fill="#E59A63">PDF</text>
    <rect x="0" y="42" width="72" height="34" rx="4" fill="none" stroke="#E59A63" stroke-width="1.6"/>
    <circle cx="20.160000000000004" cy="52.2" r="3.5" fill="#E59A63" fill-opacity="0.8"/>
    <path d="M4 70 L28.8 60.7 L43.199999999999996 66.48 L57.6 57.3 L68 70" fill="none" stroke="#E59A63" stroke-width="1.6" stroke-linejoin="round"/></g></g><g transform="translate(146,118)"><text x="30" y="-4" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" font-weight="700" fill="#E59A63">SCREENSHOT</text><path class="flow" d="M0 24 L26 24" stroke="#E59A63" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ahc)"/>
    <g transform="translate(34,2)"><rect width="38" height="44" rx="3" fill="none" stroke="#E59A63" stroke-width="1.3"/><rect x="4" y="4" width="9" height="11" fill="#E59A63" fill-opacity="0.2"/><rect x="4" y="17" width="9" height="11" fill="#E59A63" fill-opacity="0.1"/><rect x="4" y="30" width="9" height="11" fill="#E59A63" fill-opacity="0.2"/><rect x="15" y="4" width="9" height="11" fill="#E59A63" fill-opacity="0.1"/><rect x="15" y="17" width="9" height="11" fill="#E59A63" fill-opacity="0.2"/><rect x="15" y="30" width="9" height="11" fill="#E59A63" fill-opacity="0.1"/><rect x="26" y="4" width="9" height="11" fill="#E59A63" fill-opacity="0.2"/><rect x="26" y="17" width="9" height="11" fill="#E59A63" fill-opacity="0.1"/><rect x="26" y="30" width="9" height="11" fill="#E59A63" fill-opacity="0.2"/></g><path class="flow" d="M78 24 L100 24" stroke="#3DE05A" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ah)"/></g><g transform="translate(296,106)"><rect x="0" y="0" width="164" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#3DE05A">QDRANT · COLPALI</text>
    <text x="14" y="34" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" fill="#FCF3D8">no OCR · no chunking</text>
    <rect class="sq" x="14" y="48" width="16" height="30" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0s"/><rect class="sq" x="38" y="48" width="16" height="42" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0.12s"/><rect class="sq" x="62" y="48" width="16" height="54" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0.24s"/><rect class="sq" x="86" y="48" width="16" height="30" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0.36s"/><rect class="sq" x="110" y="48" width="16" height="42" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0.48s"/><rect class="sq" x="134" y="48" width="16" height="54" rx="2" fill="#E59A63" fill-opacity="0.5" style="animation-delay:0.6s"/>
    <text x="14" y="112" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8" fill="#3DE05A">page-image vectors</text></g>
</svg>