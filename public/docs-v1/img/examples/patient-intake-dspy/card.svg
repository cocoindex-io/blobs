<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Patient intake to typed JSON with DSPy — render intake PDFs to images and extract typed Patient data with a DSPy vision module.">
  <title>Patient Intake → DSPy</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="111.10000000000001" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">VISION · DSPY</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(20,104)"><rect x="0" y="0" width="134" height="130" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">🖼 PAGE.IMG</text>
    <text x="12" y="34" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.8" fill="rgba(252,243,216,0.72)">[scanned form]</text><text x="12" y="50" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.8" fill="rgba(252,243,216,0.72)">Name ▢▢▢</text><text x="12" y="66" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.8" fill="rgba(252,243,216,0.72)">DOB  ▢▢▢</text><text x="12" y="82" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.8" fill="rgba(252,243,216,0.72)">…</text>
    
  </g><g transform="translate(162,162)"><path class="flow" d="M0 0 L36 0" stroke="#BE5133" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ahc)"/><text x="18" y="-7" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.12em" font-weight="700" fill="#BE5133">DSPy</text><text x="18" y="20" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.40)">vision</text></g><g transform="translate(214,104)"><rect x="0" y="0" width="246" height="130" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#3DE05A">DSPy · TYPED</text>
    <text x="14" y="38" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#F5D76E">{</text>
    <g transform="translate(26,36)"><text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FF9B8A">"name"</text><text x="39.6" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="rgba(252,243,216,0.72)">: str</text></g><g transform="translate(26,54)"><text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FF9B8A">"dob"</text><text x="33.2" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="rgba(252,243,216,0.72)">: date</text></g><g transform="translate(26,72)"><text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FF9B8A">"symptoms"</text><text x="65.2" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="rgba(252,243,216,0.72)">: list</text></g><g transform="translate(26,90)"><text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FF9B8A">"plan"</text><text x="39.6" y="0" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="rgba(252,243,216,0.72)">: str</text></g>
    <text x="14" y="116" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="11" fill="#F5D76E">}</text>
    <g transform="translate(214,116)"><circle r="8" fill="#3DE05A" fill-opacity="0.9"/><path d="M-3 0 L-1 2.5 L3.5 -3" stroke="#2A121B" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>