<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Trending topics from HackerNews — scrape threads, extract topics with an LLM, rank trending in Postgres.">
  <title>Trending Topics from HackerNews</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="111.10000000000001" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">HN · TRENDING</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(20,106)"><rect x="0" y="0" width="128" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">HN THREADS</text>
    <text x="12" y="34" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="#E59A63">▲ 412 · rust gpu</text><text x="12" y="52" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)">▲ 287 · agents</text><text x="12" y="70" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)">▲ 196 · postgres</text><text x="12" y="88" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)">▲ 150 · wasm</text>
    <text x="12" y="116" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="8" font-style="italic" fill="rgba(252,243,216,0.40)">scraped · incremental</text></g><g transform="translate(156,160)"><path class="flow" d="M0 0 L34 0" stroke="#BE5133" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ahc)"/><text x="17" y="-7" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.12em" font-weight="700" fill="#BE5133">LLM</text><text x="17" y="18" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.40)">topics</text></g><g transform="translate(210,106)"><rect x="0" y="0" width="250" height="126" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#3DE05A">TRENDING ↑</text>
    <polyline class="" points="14,96 54,84 94,80 134,58 174,50 214,26" fill="none" stroke="#E59A63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="14,104 54,100 94,90 134,86 174,72 214,60" fill="none" stroke="#BE5133" stroke-width="1.8" stroke-dasharray="4 4"/>
    <circle class="pulse" cx="214" cy="26" r="4" fill="#F5D76E" style="animation-delay:0s"/><circle class="pulse" cx="134" cy="58" r="3" fill="#F5D76E" style="animation-delay:0.4s"/><circle class="pulse" cx="54" cy="84" r="2" fill="#F5D76E" style="animation-delay:0.8s"/>
    <text x="186" y="22" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8" fill="#F5D76E">↑ rust</text>
    <text x="14" y="118" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8" fill="rgba(252,243,216,0.40)">t-6h → now · ranked in Postgres</text></g>
</svg>