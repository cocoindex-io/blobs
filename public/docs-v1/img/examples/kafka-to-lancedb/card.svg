<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Consume Kafka into LanceDB — consume JSON messages off a Kafka topic and dispatch each by shape into matching LanceDB tables.">
  <title>Consume Kafka into LanceDB</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="131.2" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">KAFKA · DISPATCH</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(20,104)"><rect x="0" y="0" width="150" height="130" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">📨 KAFKA TOPIC</text>
    <text x="12" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)" font-weight="400">{type:order}</text><text x="12" y="47" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)" font-weight="400">{type:user}</text><text x="12" y="62" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)" font-weight="400">{type:order}</text><text x="12" y="77" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="rgba(252,243,216,0.72)" font-weight="400">{type:event}</text>
    <text x="12" y="120" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="8" font-style="italic" fill="rgba(252,243,216,0.40)">watched</text></g><g transform="translate(176,162)"><path class="flow" d="M0 0 L34 0" stroke="#3DE05A" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="17" y="-7" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.12em" font-weight="700" fill="#3DE05A">SHAPE</text>
     <rect class="sq" x="8" y="-4" width="8" height="8" rx="2" fill="#F5D76E"/></g><g transform="translate(226,104)"><rect x="0" y="0" width="234" height="130" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#F5D76E">LANCEDB TABLES</text>
    <g transform="translate(12,30)"><g transform="translate(0,0)"><rect width="210" height="20" rx="5" fill="rgba(245,215,110,0.22)" stroke="#F5D76E"/><text x="9" y="11" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="#F5D76E" font-weight="800">orders  ▦ 1.2k</text></g><g transform="translate(0,24)"><rect width="210" height="20" rx="5" fill="rgba(252,243,216,0.07)" stroke="none"/><text x="9" y="11" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="#FCF3D8" font-weight="400">users   ▦ 840</text></g><g transform="translate(0,48)"><rect width="210" height="20" rx="5" fill="rgba(252,243,216,0.07)" stroke="none"/><text x="9" y="11" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.6" fill="#FCF3D8" font-weight="400">events  ▦ 3.4k</text></g></g></g>
</svg>