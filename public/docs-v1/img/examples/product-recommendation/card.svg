<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Product recommendation graph — LLM-extract product information and pairings into a Neo4j graph powering recommendations.">
  <title>Product Recommendation Graph</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="131.2" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">PRODUCTS · GRAPH</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(14,82)"><rect x="0" y="0" width="134" height="132" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">🛍 CATALOG</text>
    <g transform="translate(12,28)"><rect width="56" height="38" rx="5" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/><rect x="8" y="8" width="40" height="14" rx="2" fill="#E59A63" opacity="0.85"/><text x="8" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.72)">camera</text></g><g transform="translate(74,28)"><rect width="56" height="38" rx="5" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/><rect x="8" y="8" width="40" height="14" rx="2" fill="#C9A0FF" opacity="0.85"/><text x="8" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.72)">lens</text></g><g transform="translate(12,74)"><rect width="56" height="38" rx="5" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/><rect x="8" y="8" width="40" height="14" rx="2" fill="#3DE05A" opacity="0.85"/><text x="8" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.72)">tripod</text></g><g transform="translate(74,74)"><rect width="56" height="38" rx="5" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/><rect x="8" y="8" width="40" height="14" rx="2" fill="#BE5133" opacity="0.85"/><text x="8" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" fill="rgba(252,243,216,0.72)">bag</text></g>
    <text x="12" y="124" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="8" font-style="italic" fill="rgba(252,243,216,0.40)">bought-together</text></g><path class="flow" d="M150 158 L273 162" stroke="#3DE05A" stroke-width="1.8" fill="none" stroke-linecap="round" marker-end="url(#ah)"/><text x="211.5" y="151" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.12em" font-weight="700" fill="#3DE05A">LLM EXTRACT</text><text x="214" y="178" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="7.5" letter-spacing="0.08em" fill="rgba(252,243,216,0.40)">→ Neo4j</text><g stroke-linecap="round"><path d="M261 78 Q296 164 355 89" fill="none" stroke="#FCF3D8" stroke-opacity="0.1" stroke-width="1"/><path d="M355 89 Q296 164 398 164" fill="none" stroke="#FCF3D8" stroke-opacity="0.1" stroke-width="1"/><path d="M398 164 Q296 164 355 239" fill="none" stroke="#FCF3D8" stroke-opacity="0.1" stroke-width="1"/><path d="M355 239 Q296 164 261 250" fill="none" stroke="#FCF3D8" stroke-opacity="0.1" stroke-width="1"/><path d="M296 164 Q289 117 261 78" fill="none" stroke="#E59A63" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round"/><path d="M296 164 Q335 134 355 89" fill="none" stroke="#C9A0FF" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round"/><path d="M296 164 Q347 176 398 164" fill="none" stroke="#3DE05A" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round"/><path d="M296 164 Q317 209 355 239" fill="none" stroke="#E59A63" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round"/><path d="M296 164 Q268 203 261 250" fill="none" stroke="#F5D76E" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round"/></g><g transform="translate(261,78)"><circle class="pulse" r="12" fill="#E59A63" style="animation-delay:0s"/></g>
      <text x="253" y="62" text-anchor="end" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#E59A63">camera</text><g transform="translate(355,89)"><circle class="pulse" r="12" fill="#C9A0FF" style="animation-delay:0.45s"/></g>
      <text x="368" y="75" text-anchor="start" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#C9A0FF">lens</text><g transform="translate(398,164)"><circle class="pulse" r="12" fill="#3DE05A" style="animation-delay:0.9s"/></g>
      <text x="419" y="167" text-anchor="start" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#3DE05A">tripod</text><g transform="translate(355,239)"><circle class="pulse" r="12" fill="#E59A63" style="animation-delay:1.35s"/></g>
      <text x="368" y="259" text-anchor="start" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#E59A63">bag</text><g transform="translate(261,250)"><circle class="pulse" r="12" fill="#F5D76E" style="animation-delay:1.8s"/></g>
      <text x="253" y="272" text-anchor="end" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="9.5" font-weight="700" fill="#F5D76E">sd card</text><g transform="translate(296,164)"><circle r="24" fill="#FCF3D8" opacity="0.12"/><circle r="19" fill="#FCF3D8"/><text y="1" text-anchor="middle" dominant-baseline="central" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="800" fill="#2A121B">cart</text></g>
</svg>