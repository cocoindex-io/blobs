<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Index your codebase — split by syntax with Tree-sitter, embed, query in English; a live vector index for coding agents.">
  <title>Index Your Codebase</title>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" fill="none" stroke="#FCF3D8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3DE05A"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E59A63"/>
    </marker>
    <style>
      .flow{stroke-dasharray:4 6;animation:mv 1.4s linear infinite}
      @keyframes mv{to{stroke-dashoffset:-20}}
      .pulse{animation:pl 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
      @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
      .blink{animation:bk 1.05s steps(2,jump-none) infinite}
      @keyframes bk{50%{opacity:0}}
      .sq{opacity:.35;animation:sq 2.4s ease-in-out infinite}
      @keyframes sq{0%,100%{opacity:.3}50%{opacity:1}}
      .rise{transform-origin:bottom;transform-box:fill-box;animation:rs 3s ease-in-out infinite}
      @keyframes rs{0%,100%{transform:scaleY(.82)}50%{transform:scaleY(1)}}
      .drift{animation:df 6s ease-in-out infinite}
      @keyframes df{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="480" height="300" fill="#381E2E"/>
  <rect width="480" height="300" fill="url(#grid)"/>
  <g transform="translate(16,14)">
    <rect width="144.60000000000002" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <text x="13" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" letter-spacing="0.13em" font-weight="700" fill="rgba(252,243,216,0.82)">CODE · TREE-SITTER</text>
  </g>
  <g transform="translate(354.6,14)">
    <rect width="109.4" height="24" rx="12" fill="rgba(252,243,216,0.05)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="16" cy="12" r="3" fill="#FB6A76"/><circle cx="27" cy="12" r="3" fill="#E59A63"/><circle cx="38" cy="12" r="3" fill="#3DE05A"/>
    <text x="52" y="12.5" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="0.02em" fill="rgba(252,243,216,0.62)">main.py</text>
  </g>
  <g transform="translate(20,102)">
    <rect width="248" height="134" rx="9" fill="rgba(0,0,0,0.28)" stroke="rgba(252,243,216,0.12)"/>
    <circle cx="14" cy="14" r="2.6" fill="#FF9B8A"/><circle cx="24" cy="14" r="2.6" fill="#E59A63"/><circle cx="34" cy="14" r="2.6" fill="#3DE05A"/>
    <g transform="translate(0,8)"><text x="14" y="32" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FCF3D8">@coco.<tspan fill="#E59A63">fn</tspan></text><text x="14" y="49" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FCF3D8">def <tspan fill="#FF9B8A">index_repo</tspan>(repo):</text><text x="14" y="66" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FCF3D8">  for <tspan fill="#FCF3D8">f</tspan> in repo.<tspan fill="#C9A0FF">files</tspan></text><text x="14" y="83" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FCF3D8">    ch = <tspan fill="#FF9B8A">split</tspan>(f)  <tspan fill="rgba(252,243,216,0.40)"># tree-sitter</tspan></text><text x="14" y="100" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#FCF3D8">    <tspan fill="#FF9B8A">embed</tspan>(ch) <tspan fill="#3DE05A">→ pgvector</tspan></text></g>
    <rect class="blink" x="92" y="110" width="6" height="12" fill="#3DE05A"/>
  </g><g transform="translate(286,102)"><rect x="0" y="0" width="174" height="134" rx="10" fill="rgba(252,243,216,0.07)" stroke="rgba(252,243,216,0.12)"/><text x="12" y="16" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" letter-spacing="0.16em" font-weight="800" fill="#E59A63">CHUNKS · AST</text>
    <g transform="translate(12,28)">
