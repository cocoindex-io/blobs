    </g>
    <line x1="12" y1="98" x2="162" y2="98" stroke="rgba(252,243,216,0.12)"/>
    <circle class="pulse" cx="18" cy="114" r="3.4" fill="#3DE05A"/>
    <text x="28" y="114" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="9" letter-spacing="0.12em" font-weight="700" fill="#3DE05A">LIVE · FRESH</text>
    <text x="162" y="114" text-anchor="end" dominant-baseline="central" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" fill="rgba(252,243,216,0.40)">Δ 12</text>
